;:&quot;Livvic&quot;,&quot;weight&quot;:&quot;400&quot;,&quot;spacing&quot;:&quot;0&quot;,&quot;height&quot;:&quot;1.75&quot;,&quot;case&quot;:&quot;none&quot;},&quot;navigationFont&quot;:{&quot;family&quot;:&quot;Livvic&quot;,&quot;weight&quot;:&quot;400&quot;,&quot;spacing&quot;:&quot;0&quot;,&quot;height&quot;:&quot;1.75&quot;,&quot;case&quot;:&quot;none&quot;}},&quot;sizes&quot;:{&quot;preheadingFont&quot;:{&quot;lg&quot;:1.125,&quot;md&quot;:1,&quot;sm&quot;:0.8},&quot;headingFont&quot;:{&quot;h1&quot;:2.25,&quot;h2&quot;:2,&quot;h3&quot;:1.5,&quot;h4&quot;:1.25},&quot;subheadingFont&quot;:{&quot;lg&quot;:1.125,&quot;md&quot;:1,&quot;sm&quot;:0.8},&quot;bodyFont&quot;:{&quot;lg&quot;:1.125,&quot;md&quot;:1,&quot;sm&quot;:0.8},&quot;buttonFont&quot;:{&quot;lg&quot;:1.15,&quot;md&quot;:1,&quot;sm&quot;:0.8},&quot;navigationFont&quot;:{&quot;lg&quot;:1.125,&quot;md&quot;:1,&quot;sm&quot;:0.8}},&quot;baseFontSize&quot;:18},&quot;structure&quot;:{&quot;globalCardCorners&quot;:0.5,&quot;globalCardShadowOpacity&quot;:0.04,&quot;globalCardShadowDepth&quot;:4.0,&quot;globalCardCollectionHeight&quot;:&quot;unified&quot;,&quot;globalGap&quot;:1.0,&quot;globalTopPadding&quot;:1.5,&quot;globalBottomPadding&quot;:1.5,&quot;globalWidth&quot;:1152,&quot;globalBorderEnabled&quot;:false,&quot;globalBorderPlacement&quot;:&quot;bottom&quot;,&quot;globalBorderStyle&quot;:&quot;solid&quot;,&quot;globalBorderSize&quot;:1,&quot;sectionCardCorners&quot;:null,&quot;sectionCardShadowOpacity&quot;:null,&quot;sectionCardShadowDepth&quot;:null,&quot;sectionCardCollectionHeight&quot;:null,&quot;sectionGap&quot;:null,&quot;sectionTopPadding&quot;:null,&quot;sectionBottomPadding&quot;:null,&quot;sectionWidth&quot;:768,&quot;sectionColumnCount&quot;:3,&quot;sectionBorderEnabled&quot;:null,&quot;sectionBorderPlacement&quot;:null,&quot;sectionBorderStyle&quot;:null,&quot;sectionBorderSize&quot;:null},&quot;mediaOptions&quot;:{&quot;aspectRatio&quot;:null,&quot;mediaCorners&quot;:null,&quot;mediaMobileFullWidth&quot;:null,&quot;mediaWidth&quot;:null,&quot;globalOptions&quot;:{&quot;imageCorners&quot;:&quot;hard&quot;,&quot;imageMobileFullWidth&quot;:true,&quot;videoCorners&quot;:&quot;hard&quot;,&quot;videoMobileFullWidth&quot;:true,&quot;linkedImageHover&quot;:&quot;fade&quot;}},&quot;interactivesOptions&quot;:{&quot;linkStyles&quot;:&quot;underline&quot;,&quot;linkHover&quot;:&quot;fade&quot;,&quot;linkHoverColor&quot;:&quot;#158C78&quot;,&quot;navigationLinkStyles&quot;:&quot;none&quot;,&quot;navigationLinkHover&quot;:&quot;fade&quot;,&quot;navigationLinkHoverColor&quot;:&quot;#158C78&quot;,&quot;linkedTitleStyles&quot;:&quot;none&quot;,&quot;linkedTitleHover&quot;:&quot;fade&quot;,&quot;linkedTitleHoverColor&quot;:&quot;#158C78&quot;,&quot;buttonStyles&quot;:&quot;flat&quot;,&quot;buttonCorners&quot;:&quot;hard&quot;,&quot;buttonHover&quot;:&quot;fade&quot;,&quot;iconHover&quot;:&quot;fade&quot;},&quot;renderingMode&quot;:&quot;live&quot;,&quot;sectionAnchorId&quot;:&quot;h_15fb0923ea&quot;},&quot;headingLevel&quot;:&quot;2&quot;,&quot;preheading&quot;:null,&quot;heading&quot;:&quot;Post content&quot;,&quot;subheading&quot;:null,&quot;id&quot;:90926790,&quot;domId&quot;:&quot;blog_post_content_page_section_90926790&quot;,&quot;button&quot;:{&quot;text&quot;:null,&quot;url&quot;:&quot;&quot;,&quot;target&quot;:null},&quot;button2&quot;:{&quot;text&quot;:null,&quot;url&quot;:&quot;&quot;,&quot;target&quot;:null},&quot;buttonSubtext&quot;:null,&quot;mediaPlacement&quot;:null,&quot;textAlignment&quot;:&quot;left&quot;,&quot;headerAlignment&quot;:null,&quot;mediaStyle&quot;:&quot;media-style-plain&quot;,&quot;body&quot;:&quot;\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003ePodia blog posts can have written text as well as design elements like images, videos, dividers, embeds, buttons, and file downloads. Here are 5 popular features you can add to your content in just a few clicks.\u003c/p\u003e\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#1 Style your text however you like\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eTo give your text a bit of flair, all you need to do is highlight it and a text-style toolbar will appear. You can adjust headings, choose between large and small text, and add text decorations like: \u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003e\u003cstrong\u003eBold\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003e\u003cem\u003eItalic\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003e\u003cs\u003eStrikethrough\u003c/s\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003e\u003cmark class=\&quot;text-highlight-green\&quot;\u003eColor highlight\u003c/mark\u003e\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003e\u003ca href=\&quot;https://www.podia.com\&quot; target=\&quot;_self\&quot;\u003eLinks\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eThis is also where you can change the text alignment and add bullet points, numbers, and block quotes. Text styles are a great way to call attention to the most important parts of your article, share helpful links, and structure your content with headings and bullets or numbers so it&#39;s easy to read.\u003c/p\u003e\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#2 Create buttons to make links stand out\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eYou can also use buttons to call attention to specific links in your content. For instance, you might want to create a button that links to your email sign-up page, a related blog post, or a digital product you&#39;re promoting.\u003c/p\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eTo add a button, click the forward slash key (/) and a drop-down menu will appear. Choose the “Button” option and you&#39;ll be prompted to add your button text and destination link.\u003c/p\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eYou can left, right, or center align your button, and you can update the color and font of your button in the Design menu of Podia&#39;s \u003ca href=\&quot;https://app.podia.com/editor\&quot; target=\&quot;_blank\&quot;\u003emain website editor\u003c/a\u003e. \u003c/p\u003e\u003cdiv class=\&quot;rich-text--button\&quot; style=\&quot;text-align: center;\&quot;\u003e\n  \u003ca target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot; class=\&quot;rich-text--button--link\&quot; href=\&quot;https://app.podia.com/editor\&quot;\u003eThis button will take you to the website editor\u003c/a\u003e\n\u003c/div\u003e\n\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#3 Add images to your Podia blog posts\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eIf you&#39;d like to add an image (or several!) to your blog post, hit the forward slash key anywhere within the article editor. When the dropdown menu appears, select “image” from the list. Then you can easily add your image file along with an optional image link and ALT text.\u003c/p\u003e\u003cdiv class=\&quot;rich-text--image\&quot; style=\&quot;text-align: center;\&quot;\u003e\u003cimg src=\&quot;https://s3.us-west-2.amazonaws.com/content.podia.com/yd05a64ppalu2lxtd5wrs9kvs93b\&quot; alt=\&quot;How to add images to your Podia blog posts\&quot; style=\&quot;width: 100%;\&quot;\u003e\u003c/div\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eYou can include as many images as you like in your article, and images are a great way to share your artwork, photography, infographics, charts, and other visuals to support your ideas.\u003c/p\u003e\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#4 Add videos to your Podia blog posts\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eYou can also add videos to your Podia blog posts. Hit that handy forward slash key again, and choose “Embed” from the drop-down menu. Drop a link to your video from YouTube, Vimeo, or another video-sharing platform, and your video will appear embedded in the blog post like the one below.\u003c/p\u003e\u003cdiv class=\&quot;rich-text--embed\&quot;\u003e\u003cdiv\u003e\u003cdiv class=\&quot;oembed-object\&quot;\u003e\u003cdiv style=\&quot;left: 0; width: 100%; height: 0; position: relative; padding-bottom: 56.25%;\&quot;\u003e\u003ciframe src=\&quot;https://www.youtube.com/embed/rbJjlZo5u-A?rel=0\&quot; style=\&quot;top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;\&quot; allowfullscreen=\&quot;\&quot; allow=\&quot;accelerometer *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;\&quot; referrerpolicy=\&quot;strict-origin\&quot; sandbox=\&quot;allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation allow-forms\&quot; title=\&quot;Podia plans and pricing\&quot;\u003e\u003c/iframe\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eYou can also share your video as a file download if you don&#39;t have it listed anywhere online. Scroll down to #6 to learn how!\u003c/p\u003e\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#5 Embed content from social media and other websites\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003ePodia&#39;s embed feature lets you add content from +1,900 sources around the web, so you can easily embed podcast episodes, Typeforms, quizzes, spreadsheets, slideshows, audio files, Spotify playlists, Github code, and pretty much anything else you can imagine.\u003c/p\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eAgain, all you need to do is hit the forward slash key and choose “Embed”. You can paste a link to the content you&#39;d like to share directly in the embed box, and it will appear automatically in your blog post. For example, here&#39;s what happens when you embed a link to an Instagram post.\u003c/p\u003e\u003cdiv class=\&quot;rich-text--embed\&quot;\u003e\u003cdiv\u003e\u003cdiv class=\&quot;oembed-object\&quot;\u003e\u003cdiv style=\&quot;max-width: 660px;\&quot;\u003e\u003cdiv style=\&quot;left: 0; width: 100%; height: 0; position: relative; padding-bottom: 63%; padding-top: 284px;\&quot;\u003e\u003ciframe src=\&quot;//oembeds.podia.com/api/iframe?app=1\u0026amp;url=https%3A%2F%2Fwww.instagram.com%2Fp%2FC0jlfvCOn3S%2F%3Futm_source%3Dig_web_copy_link%26igsh%3DMzRlODBiNWFlZA%3D%3D\u0026amp;key=03bbb165a71ae7da90bd7295ac78454e\&quot; style=\&quot;top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;\&quot; allowfullscreen=\&quot;\&quot; sandbox=\&quot;allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation allow-forms\&quot; title=\&quot;Podia on Instagram: \u0026quot;Share your best time management tips for creators!   Here are a few of our favorites:   ⏰ Set and stick to a routine  🛋️ Have a dedicated working space to get in the zone 📅 Give yourself rewards for doing tasks you&#39;re putting off  ⚡ Work in smaller bursts with a break between sessions 🔁 Outsource and automate to take work off your plate 😴 Take care of your physical and mental needs to prevent burnout   Do you have any tips for managing your time and getting things done? Let us know in the comments. ⬇️  #contentcreator #contentcreatorlife #timemanagement #workfromanywhere #onlinecoursecreators\u0026quot;\&quot;\u003e\u003c/iframe\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch2 style=\&quot;text-align: left;\&quot;\u003e#6 Include file downloads\u003c/h2\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eWant to share a downloadable resource with your readers? Podia makes that simple too.\u003c/p\u003e\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eInclude your latest guide, ebook, printable, documentary, album, PDF, or any other type of downloadable file by hitting the forward slash key and choosing “File” from the dropdown menu. Add your file from your computer, and once your article is published, your readers will be able to instantly download your file by clicking on it.\u003c/p\u003e\u003cdiv class=\&quot;rich-text--file-wrapper\&quot; style=\&quot;text-align: left;\&quot;\u003e\n  \u003ca class=\&quot;rich-text--file\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot; href=\&quot;https://s3.us-west-2.amazonaws.com/content.podia.com/2vwkqvjnb7z71bm2knp8h80fuj4o\&quot;\u003e\n    \u003cdiv class=\&quot;preview\&quot;\u003e\n        \u003csvg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; width=\&quot;16\&quot; height=\&quot;16\&quot; viewBox=\&quot;0 0 16 16\&quot; class=\&quot;\&quot;\u003e\u003cpath fill-rule=\&quot;evenodd\&quot; clip-rule=\&quot;evenodd\&quot; d=\&quot;M11.7833 12.8111C12.351 12.8111 12.8111 12.3509 12.8111 11.7833V4.22773C12.8111 3.6601 12.351 3.19995 11.7833 3.19995H4.22777C3.66015 3.19995 3.2 3.6601 3.2 4.22773V11.7833C3.2 12.3509 3.66015 12.8111 4.22777 12.8111H11.7833ZM14.3111 11.7833C14.3111 13.1793 13.1794 14.3111 11.7833 14.3111H4.22777C2.83172 14.3111 1.7 13.1793 1.7 11.7833V4.22773C1.7 2.83168 2.83172 1.69995 4.22777 1.69995H11.7833C13.1794 1.69995 14.3111 2.83168 14.3111 4.22773V11.7833Z\&quo

obileFullWidth&quot;:null,&quot;mediaWidth&quot;:null,&quot;globalOptions&quot;:{&quot;imageCorners&quot;:&quot;hard&quot;,&quot;imageMobileFullWidth&quot;:true,&quot;videoCorners&quot;:&quot;hard&quot;,&quot;videoMobileFullWidth&quot;:true,&quot;linkedImageHover&quot;:&quot;fade&quot;}},&quot;interactivesOptions&quot;:{&quot;linkStyles&quot;:&quot;underline&quot;,&quot;linkHover&quot;:&quot;fade&quot;,&quot;linkHoverColor&quot;:&quot;#158C78&quot;,&quot;navigationLinkStyles&quot;:&quot;none&quot;,&quot;navigationLinkHover&quot;:&quot;fade&quot;,&quot;navigationLinkHoverColor&quot;:&quot;#158C78&quot;,&quot;linkedTitleStyles&quot;:&quot;none&quot;,&quot;linkedTitleHover&quot;:&quot;fade&quot;,&quot;linkedTitleHoverColor&quot;:&quot;#158C78&quot;,&quot;buttonStyles&quot;:&quot;flat&quot;,&quot;buttonCorners&quot;:&quot;hard&quot;,&quot;buttonHover&quot;:&quot;fade&quot;,&quot;iconHover&quot;:&quot;fade&quot;},&quot;renderingMode&quot;:&quot;live&quot;,&quot;sectionAnchorId&quot;:&quot;h_15fb0923ea&quot;},&quot;headingLevel&quot;:&quot;2&quot;,&quot;preheading&quot;:null,&quot;heading&quot;:&quot;Post content&quot;,&quot;subheading&quot;:null,&quot;id&quot;:90926790,&quot;domId&quot;:&quot;blog_post_content_page_section_90926790&quot;,&quot;button&quot;:{&quot;text&quot;:null,&quot;url&quot;:&quot;&quot;,&quot;target&quot;:null},&quot;button2&quot;:{&quot;text&quot;:null,&quot;url&quot;:&quot;&quot;,&quot;target&quot;:null},&quot;buttonSubtext&quot;:null,&quot;mediaPlacement&quot;:null,&quot;textAlignment&quot;:&quot;left&quot;,&quot;headerAlignment&quot;:null,&quot;mediaStyle&quot;:&quot;media-style-plain&quot;,&quot;body&quot;:&quot;\u003cp style=\&quot;text-align: left;\&quot; class=\&quot;text-base\&quot;\u003eDuring a recent Bible study, something struck me deeply while reading the book of Job.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eIn the midst of his suffering, confusion, and unanswered questions, Job cried out for something profound. In Job 9:33, he says:\u003c/p\u003e\u003cblockquote\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003e“If only there were someone to mediate between us, someone to bring us together.”\u003c/p\u003e\u003c/blockquote\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eJob longed for an intercessor.\u003cbr\u003eSomeone who could stand between him and God.\u003cbr\u003eSomeone who could understand both divine justice and human pain.\u003cbr\u003eSomeone who could plead his case.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eBut Job lived before the cross.\u003cbr\u003eHe endured unimaginable suffering without the revelation we now carry.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eHow fortunate we are.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eWe live in the generation that has King Jesus.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eWhat Job desired, we possess.\u003cbr\u003eWhat Job longed for, we have been given freely.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eWe have a Mediator.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003e1 Timothy 2:5 declares:\u003c/p\u003e\u003cblockquote\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003e“For there is one God and one mediator between God and mankind, the man Christ Jesus.”\u003c/p\u003e\u003c/blockquote\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eWhen we fall short, the blood speaks.\u003cbr\u003eWhen we are misunderstood, the blood speaks.\u003cbr\u003eWhen shame tries to silence us, the blood speaks.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eJob wished for someone to bridge the gap.\u003cbr\u003eWe stand in a covenant where the gap has already been closed.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eHebrews 12:24 tells us that the blood of Jesus “speaks a better word.”\u003cbr\u003eA better word than guilt.\u003cbr\u003eA better word than accusation.\u003cbr\u003eA better word than condemnation.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eJob wrestled in pain without the clarity of Calvary.\u003cbr\u003eWe wrestle with the assurance of redemption.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eWhat a privilege.\u003cbr\u003eWhat a gift.\u003cbr\u003eWhat a King.\u003c/p\u003e\u003cp style=\&quot;\&quot; class=\&quot;text-base\&quot;\u003eMay we never take lightly what generations before us only hoped for — access, advocacy, and intimacy with God through King Jesus.\u003c/p\u003e&quot;}"></div>
